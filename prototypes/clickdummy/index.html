<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F5F7F9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#181E28" media="(prefers-color-scheme: dark)" />
    <title>werkbuch Klickdummy</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M7 4h9l2 5H5z' fill='%2389c0e3'/%3E%3Crect x='3' y='8' width='26' height='20' rx='5' fill='%232f51b6'/%3E%3C/svg%3E"
    />
    <script>
      // Theme before the first paint. 'light' and 'dark' set data-theme; 'system' (or nothing) leaves it to the OS.
      try {
        var theme = localStorage.getItem('werkbuch:theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (error) {
        // storage blocked: follow the OS
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
