name: werkbuch
type: laravel
docroot: public
php_version: "8.4"
webserver_type: nginx-fpm
xdebug_enabled: false
database:
  type: mariadb
  version: "11.4"
composer_version: "2"
nodejs_version: "24"
corepack_enable: true
# PCOV for `ddev artisan test --coverage` (Xdebug stays off)
webimage_extra_packages: ["php${DDEV_PHP_VERSION}-pcov"]
web_environment:
  - COREPACK_ENABLE_DOWNLOAD_PROMPT=0
  # webhooks may point at hosts in the private network (the e2e receiver, a service next to the app), A373
  - WEBHOOKS_ALLOW_PRIVATE=true
  # e2e never tests the limits of the API (Pest does): the specs poll and share Erik, the four variants one cache (K9)
  - API_RATE_LIMIT=6000
  - API_SESSION_RATE_LIMIT=60000
  # the browser reaches Reverb on its own port, not under APP_URL (LiveAddress)
  - REVERB_PUBLIC_PORT=6001
# https://werkbuch.ddev.site:<https_port> → container port
web_extra_exposed_ports:
  - { name: vite, container_port: 5173, http_port: 5172, https_port: 5173 }
  - { name: vitepress, container_port: 5174, http_port: 5175, https_port: 5174 }
  - { name: clickdummy, container_port: 5176, http_port: 5177, https_port: 5176 }
  - { name: reverb, container_port: 6001, http_port: 6002, https_port: 6001 }
# each daemon waits until composer install and .env exist, so a fresh clone starts cleanly
# three queue workers: `queue:listen` boots PHP for every job and takes the queues strictly in their order, and every
# event makes jobs for `default`, `live` and `notifications` (the sign-in mails have the queue `mail` ahead of them); search and media in one worker after those starved
# (search results and previews came minutes late), so they have a worker of their own; so do the webhooks, for a
# receiver that hangs holds its worker up to 17 s per attempt (T16-M5)
web_extra_daemons:
  - name: queue
    command: bash -c 'until [ -f vendor/autoload.php ] && [ -f .env ]; do sleep 5; done; exec php artisan queue:listen --queue=mail,default,live,notifications,bulk --sleep=1 --tries=3'
    directory: /var/www/html
  - name: queue-index
    command: bash -c 'until [ -f vendor/autoload.php ] && [ -f .env ]; do sleep 5; done; exec php artisan queue:listen --queue=search,media --sleep=1 --tries=3'
    directory: /var/www/html
  - name: queue-webhooks
    command: bash -c 'until [ -f vendor/autoload.php ] && [ -f .env ]; do sleep 5; done; exec php artisan queue:listen --queue=webhooks --sleep=1 --tries=3'
    directory: /var/www/html
  - name: scheduler
    command: bash -c 'until [ -f vendor/autoload.php ] && [ -f .env ]; do sleep 5; done; exec php artisan schedule:work'
    directory: /var/www/html
  - name: reverb
    command: bash -c 'until [ -f vendor/autoload.php ] && [ -f .env ]; do sleep 5; done; exec php artisan reverb:start --host=0.0.0.0 --port=6001'
    directory: /var/www/html
hooks:
  post-start:
    # separate database for Pest (phpunit.xml forces DB_DATABASE=testing)
    - exec: bash -c 'C=$(command -v mariadb || command -v mysql); $C -uroot -proot -e "CREATE DATABASE IF NOT EXISTS testing; GRANT ALL ON testing.* TO '"'"'db'"'"'@'"'"'%'"'"';"'
      service: db
    # separate database for the load suite (phpunit.load.xml forces DB_DATABASE=load); `load` is a reserved word
    - exec: bash -c 'C=$(command -v mariadb || command -v mysql); $C -uroot -proot -e "CREATE DATABASE IF NOT EXISTS \`load\`; GRANT ALL ON \`load\`.* TO '"'"'db'"'"'@'"'"'%'"'"';"'
      service: db
