# Gotenberg 8 for the PDF of wiki pages (WEBU-4), reachable from the web container as http://gotenberg:3000.
# Hardened like openbill: Chromium runs no JavaScript and loads nothing but Gotenberg's own working files
# (file:///tmp/...) and data: URLs (pictures are inlined); no private or public addresses.
# Pinned like docker-compose.yml, docker-compose.standalone.yml and the CI (tests/Feature/Docker/ComposeTest.php keeps them equal).
services:
  gotenberg:
    container_name: ddev-${DDEV_SITENAME}-gotenberg
    image: gotenberg/gotenberg:8.37.0@sha256:f29984bd1e226bf1b93ba90af06000afa8b315853e99d27b9aaa41b93f15c769
    command:
      - gotenberg
      - --chromium-disable-javascript=true
      - --chromium-deny-list=^file:(?!//\/tmp/).*
      - --chromium-deny-list=^(?!(file|data):).*
      - --chromium-deny-private-ips=true
      - --chromium-deny-public-ips=true
    restart: "no"
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
    expose:
      - "3000"
