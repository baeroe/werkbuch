name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # required check: the name must stay `tests`
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: prototypes/clickdummy/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: prototypes/clickdummy/.node-version
          cache: pnpm
          cache-dependency-path: prototypes/clickdummy/pnpm-lock.yaml
      - name: Install (clickdummy)
        run: pnpm --dir prototypes/clickdummy install --frozen-lockfile
      - name: Typecheck (clickdummy)
        run: pnpm --dir prototypes/clickdummy typecheck
      - name: Unit tests (clickdummy)
        run: pnpm --dir prototypes/clickdummy test
      - name: Build (clickdummy)
        run: pnpm --dir prototypes/clickdummy build

  # the Playwright flows of the clickdummy; not a required check
  clickdummy-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/clickdummy
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: prototypes/clickdummy/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: prototypes/clickdummy/.node-version
          cache: pnpm
          cache-dependency-path: prototypes/clickdummy/pnpm-lock.yaml
      - name: Install (clickdummy)
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Flows (clickdummy)
        run: pnpm e2e
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clickdummy-playwright-report
          path: |
            prototypes/clickdummy/playwright-report
            prototypes/clickdummy/test-results
          retention-days: 7
