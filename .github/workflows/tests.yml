name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # required check: the name must stay `tests`
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck (clickdummy)
        run: pnpm --filter werkbuch-clickdummy typecheck
      - name: Unit tests (clickdummy)
        run: pnpm --filter werkbuch-clickdummy test
      - name: Build (clickdummy)
        run: pnpm --filter werkbuch-clickdummy build

  # the Playwright flows and the review build checks of the clickdummy; not a required check
  clickdummy-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter werkbuch-clickdummy exec playwright install --with-deps chromium
      - name: Flows and review build (clickdummy)
        run: pnpm --filter werkbuch-clickdummy e2e
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clickdummy-playwright-report
          path: |
            prototypes/clickdummy/playwright-report
            prototypes/clickdummy/test-results
          retention-days: 7
