name: Docker Hub description

on:
  push:
    branches: [main]
    paths: ['README.md', '.github/workflows/dockerhub.yml']
  # after a release: the repository on Docker Hub only exists once the first image is pushed
  workflow_run:
    workflows: ['Docker image']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # by hand only from main: the token may write the description, and it should never be the README of another branch
  sync:
    if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Repository on Docker Hub
        id: hub
        run: |
          if curl -fsS -o /dev/null https://hub.docker.com/v2/repositories/baeroe/werkbuch/; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::baeroe/werkbuch is not on Docker Hub yet (no release pushed), nothing to sync"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # needs a Docker Hub token with read/write/delete scope; pinned by commit because it sees that token
      - if: steps.hub.outputs.exists == 'true'
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: baeroe/werkbuch
          short-description: 'Self-hosted project management: custom types, workflows, views, wiki, REST API, MCP, webhooks'
          enable-url-completion: true
