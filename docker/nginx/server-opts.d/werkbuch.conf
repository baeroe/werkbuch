# werkbuch, server context (serversideup includes server-opts.d/*.conf in the server of site-opts.d/http.conf).
access_log /dev/stdout werkbuch if=$werkbuch_loggable;

# Docker's DNS: nginx resolves reverb per request, so it starts before Reverb runs and answers 502 until then
resolver 127.0.0.11 valid=10s ipv6=off;
# without Docker's network there is no 127.0.0.11: answer 502 at once instead of after 30 s
resolver_timeout 5s;

# only the WebSocket; Reverb's HTTP API (/apps/) stays inside the stack, the server sends to reverb:6001 (A415)
location ^~ /app/ {
    set $werkbuch_reverb http://reverb:6001;
    proxy_pass $werkbuch_reverb;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
}
