# werkbuch, server context (serversideup includes server-opts.d/*.conf in the server of site-opts.d/http.conf).
access_log /dev/stdout werkbuch if=$werkbuch_loggable;

# Docker's DNS: nginx resolves reverb per request, so it starts before Reverb runs and answers 502 until then
resolver 127.0.0.11 valid=10s ipv6=off;
# without Docker's network there is no 127.0.0.11: answer 502 at once instead of after 30 s
resolver_timeout 5s;

# only the WebSocket; Reverb's HTTP API (/apps/) stays inside the stack, the server sends to reverb:6001 (A415)
location ^~ /app/ {
    set $werkbuch_reverb http://reverb:6001;
    proxy_pass $werkbuch_reverb;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
}

# The base redirects /index.php/<rest> to /<rest> (location ~ ^/index\.php(/.+)$ in site-opts.d/http.conf). For
# /index.php/%5Cevil.example that is "Location: /\evil.example", which browsers read as another host: an open redirect
# (GHSA-3634-2fr7-xpw4, fixed in v5.2.1). werkbuch never links /index.php/<rest>, so every such path is a 404 here.
# server-opts.d comes after the base's regex locations, and the first matching regex wins: this is a prefix location
# with ^~, which nginx takes without looking at any regex. /index.php itself (the front controller) is untouched.
location ^~ /index.php/ {
    return 404;
}

# The installer of the runner (A520): security.conf denies every path ending in .sh (a script left in public/ stays
# private), /runner/install.sh is no file but a route of Laravel. An exact location wins over every regex.
location = /runner/install.sh {
    try_files $uri /index.php?$query_string;
}
