# werkbuch, http context: sorts before default.conf, so the format and the variables are known when nginx reads the
# server. The log names $request_uri, never $uri: after try_files every line would say /index.php.

# the logged path: never the query string (signatures of invitations and uploads), the reset token or the upload token.
# Laravel decodes the path before it routes (/%72eset-password/<token> is the reset page): from the first % on, the path
# is cut off. The masks are ASCII, nginx writes other bytes of a log line as \xNN.
map $request_uri $werkbuch_logged_uri {
    ~*^/reset-password/   /reset-password/...;
    ~*^/api/mcp/uploads/  /api/mcp/uploads/...;
    "~^(?<werkbuch_path>[^?%]*)%"  "${werkbuch_path}%...";
    "~^(?<werkbuch_path>[^?]*)"  $werkbuch_path;
}

# the compose health check asks /up every 15 s from inside the container; anyone else's /up is logged
map "$remote_addr $request_uri" $werkbuch_loggable {
    "~^(127\.0\.0\.1|::1) /up(\?|$)"  0;
    default  $loggable;
}

# no referer (it carries query strings of other pages); the forwarded address is the client behind a proxy
log_format werkbuch '$remote_addr - [$time_local] "$request_method $werkbuch_logged_uri $server_protocol" $status $body_bytes_sent $request_time "$http_user_agent" "$http_x_forwarded_for"';
